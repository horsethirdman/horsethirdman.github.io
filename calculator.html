<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scale Distance Calculator</title>
</head>
<body>
  <h1>Scale Distance Calculator</h1>

  <div>
    <label for="scaleRatio">Scale (1 : X):</label>
    <span>1 : </span>
    <input type="number" id="scaleRatio" value="100" min="0" step="any">
  </div>

  <br>

  <div>
    <label for="drawingDist">Drawing Distance:</label>
    <input type="number" id="drawingDist" value="1" min="0" step="any">
    <select id="drawingUnit">
      <option value="0.001">mm</option>
      <option value="0.01" selected>cm</option>
      <option value="1">m</option>
      <option value="1000">km</option>
      <option value="0.0254">in</option>
      <option value="0.3048">ft</option>
    </select>
  </div>

  <br>

  <div>
    <label for="realUnit">Output Unit:</label>
    <select id="realUnit">
      <option value="0.01">cm</option>
      <option value="1" selected>m</option>
      <option value="1000">km</option>
      <option value="0.3048">ft</option>
      <option value="0.9144">yd</option>
      <option value="1609.344">mi</option>
    </select>
  </div>

  <br>

  <div>
    <strong>Real Distance: </strong>
    <span id="result">1</span>
    <span id="resultUnitLabel">m</span>
  </div>

  <script>
    const scaleRatioInput = document.getElementById('scaleRatio');
    const drawingDistInput = document.getElementById('drawingDist');
    const drawingUnitSelect = document.getElementById('drawingUnit');
    const realUnitSelect = document.getElementById('realUnit');
    const resultSpan = document.getElementById('result');
    const resultUnitLabel = document.getElementById('resultUnitLabel');

    function calculate() {
      const scale = parseFloat(scaleRatioInput.value);
      const dist = parseFloat(drawingDistInput.value);
      const drawToMeters = parseFloat(drawingUnitSelect.value);
      const realToMeters = parseFloat(realUnitSelect.value);

      if (isNaN(scale) || isNaN(dist) || scale <= 0 || dist < 0) {
        resultSpan.textContent = 'Invalid input';
        resultUnitLabel.textContent = '';
        return;
      }

      // Convert drawing distance to meters, multiply by scale, then convert to target unit
      const realMeters = dist * drawToMeters * scale;
      const finalResult = realMeters / realToMeters;

      // Round to avoid floating point artifacts (up to 6 decimal places)
      resultSpan.textContent = Number(finalResult.toFixed(6));
      resultUnitLabel.textContent = realUnitSelect.options[realUnitSelect.selectedIndex].text;
    }

    scaleRatioInput.addEventListener('input', calculate);
    drawingDistInput.addEventListener('input', calculate);
    drawingUnitSelect.addEventListener('change', calculate);
    realUnitSelect.addEventListener('change', calculate);

    calculate();
  </script>
</body>
</html>
