<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body {
    }
    .container{
      display: flex;
      height: 100vh; /* Full viewport height */
    }
    .section{
      flex: 1; /* Makes both sections equal width (50% each) */
      padding: 20px;
    }
    .left{
      background-color: #f4f4f4;
    }
    .right{
      background-color: #e0e0e0;
    }
    #notes{
      width: 100%
    }
  </style>
</head>
<body>

  <div class="container">
    <section class="section left">
      <h2>Left Section</h2>
      <p>Content for the left side goes here.</p>
      <input type="text" id="notes"></input>
    </section>
    
    <section class="section right">
      <h2>Right Section</h2>
      <p>Content for the right side goes here.</p>
    </section>
  </div>

</body>
</html>
